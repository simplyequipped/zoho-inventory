[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zoho-inventory"
version = "0.1.0"
description = "Command-line client for the Zoho Inventory API, for terminal and scripted use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
zoho = "zoho_inventory.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/zoho_inventory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
